<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><rect width="1400" height="600" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="55" y="60" font-size="34" font-weight="bold">Streaming sees account states between HTTP polls</text><text x="55" y="99" font-size="20" fill="#52627a">120 seconds, Clock sysvar, confirmed commitment, one deliberate disconnect at 40 seconds.</text><text x="55" y="215" font-size="25" fill="#e55022">WebSocket</text><rect x="300" y="180" width="850.0" height="50" rx="6" fill="#e55022"/><text x="1165.0" y="215" font-size="25" fill="#e55022">547</text><text x="55" y="325" font-size="25" fill="#2563eb">HTTP polling</text><rect x="300" y="290" width="88.57404021937843" height="50" rx="6" fill="#2563eb"/><text x="403.57404021937845" y="325" font-size="25" fill="#2563eb">57</text><text x="55" y="440" font-size="24" fill="#52627a">Matched states: 55 | WebSocket first: 24 | HTTP first: 31</text><text x="55" y="490" font-size="22" fill="#52627a">Median HTTP minus WebSocket: -11.482 ms. Negative means HTTP arrived first.</text><text x="55" y="548" font-size="21" fill="#52627a">Unique observed states are not every account write. Reconnect snapshots do not replay missed events.</text></g></svg>