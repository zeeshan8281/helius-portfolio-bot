<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172b4d"><text x="55" y="60" font-size="34" font-weight="bold">One trade, two observation paths</text><text x="55" y="99" font-size="20" fill="#52627a">The transaction stays the same. Only the way the application learns about it changes.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52627a"/></marker></defs><rect x="55" y="230" width="270" height="150" rx="16" fill="#f8fafc" stroke="#172b4d" stroke-width="2"/><text x="73" y="266" font-size="24" fill="#172b4d">Guarded local executor</text><text x="73" y="300" font-size="19" fill="#172b4d">Simulate and sign</text><text x="73" y="329" font-size="19" fill="#172b4d">Persist before submission</text><rect x="430" y="150" width="310" height="145" rx="16" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="448" y="186" font-size="24" fill="#2563eb">HTTP polling</text><text x="448" y="220" font-size="19" fill="#172b4d">getSignatureStatuses</text><text x="448" y="249" font-size="19" fill="#172b4d">Wait 2s after each response</text><rect x="430" y="370" width="310" height="145" rx="16" fill="#f8fafc" stroke="#e55022" stroke-width="2"/><text x="448" y="406" font-size="24" fill="#e55022">WebSocket subscriptions</text><text x="448" y="440" font-size="19" fill="#172b4d">signatureSubscribe</text><text x="448" y="469" font-size="19" fill="#172b4d">confirmed + finalized</text><rect x="860" y="230" width="475" height="150" rx="16" fill="#f8fafc" stroke="#047857" stroke-width="2"/><text x="878" y="266" font-size="24" fill="#047857">Finalized reconciliation</text><text x="878" y="300" font-size="19" fill="#172b4d">getTransaction + actual wallet effects</text><text x="878" y="329" font-size="19" fill="#172b4d">Verify exact USDC debit, SOL output and fee</text><path d="M 325 268 L 420 220" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 325 338 L 420 440" stroke="#e55022" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 740 220 L 850 268" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 740 440 L 850 338" stroke="#e55022" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="55" y="590" font-size="23" fill="#52627a">A notification is an observation. A reconciled receipt establishes the money that moved.</text></g></svg>